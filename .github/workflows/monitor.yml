name: Monitor da produção

# A cada 15 minutos consulta /health/detalhado (banco no ar, nenhuma migração
# pendente, sem rajada de erros internos). Se falhar, o GitHub envia e-mail
# para o dono do repositório. Não usa nenhum segredo nem acessa dados.
# Obs.: o GitHub desativa workflows agendados em repositórios sem nenhuma
# atividade por 60 dias — qualquer commit reativa.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  saude:
    runs-on: ubuntu-latest
    steps:
      - name: /health/detalhado
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o resposta.json -w "%{http_code}" --max-time 40 https://sistema-rio-vita-production.up.railway.app/health/detalhado || echo 000)
            echo "tentativa $tentativa -> HTTP $codigo"; cat resposta.json 2>/dev/null; echo
            [ "$codigo" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::A API da Rio Vita não está saudável"
          exit 1
