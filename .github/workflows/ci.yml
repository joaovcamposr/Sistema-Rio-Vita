name: CI

# Roda a cada push e pull request. Nada aqui usa dados nem segredos de
# produção: o Postgres abaixo é descartável e criado do zero a cada execução.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-secret-com-mais-de-32-caracteres-aaaaaaaa
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # erros de nome/import que o Python só descobriria em tempo de execução
      - run: python -m pyflakes app tests
      # aplica TODAS as migrações num banco vazio, roda o fluxo de vendas/caixa,
      # chama todos os endpoints GET e testa backup/restauração
      - run: python -m pytest tests -q

  restauracao:
    # prova, a cada commit, que um backup gerado restaura num banco novo com
    # os mesmos números — o teste que mais importa para "nunca perder dados"
    runs-on: ubuntu-latest
    services:
      origem:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      destino:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/ensaio_restauracao.py
        env:
          URL_ORIGEM: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          URL_DESTINO: postgresql+psycopg://postgres:postgres@localhost:5433/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
